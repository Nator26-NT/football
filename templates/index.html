<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="description" content="AI football predictions for today's fixtures — Serie A, Premier League, La Liga & more."/>
  <title>⚽ Today's Football Predictions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- ================= HEADER ================= -->
  <header class="hero" role="banner">
    <div class="container hero-inner">
      <a href="#/" class="brand" aria-label="Home">
        <span class="brand-icon" aria-hidden="true">⚽</span>
        <span class="brand-text">Footy Predictor</span>
      </a>
      <h1 class="hero-title">Today's Football Predictions</h1>
      <p id="todayDate" class="hero-date" aria-live="polite">Loading date…</p>

  </header>

  <!-- ================= MAIN APP ================= -->
  <main id="app" class="container" role="main">
    <!-- Rendered by JS: either home or prediction sub-page -->
    <div class="loading">Loading…</div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>Predictions for entertainment only. Data from API‑Football.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>

</html>
